# One process serves every wiki. nginx passes the original Host so
# Wikiwright can pick the site. Terminate TLS in front of this block
# and set cookie_secure: true in the Wikiwright config.
server {
    listen 80;
    listen [::]:80;
    server_name wiki.example.org draft.example.org;

    client_max_body_size 100m;

    location / {
        proxy_pass http://127.0.0.1:43123;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
